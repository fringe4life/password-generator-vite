<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="src/favicon.ico" rel="icon" type="image/x-icon">
  <link rel="stylesheet" href="src/index.css"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <script src="src/main.ts" type="module"></script>
</head>

<body>
  <section class="wrapper input" >
    <header>
      <h1>Generate a</h1>
      <h1 class="green">random password</h1>
      <h2>Never use an insecure password again.</h2>
    </header>

    <form id="passwordForm">
      <label for="length">Password Length:</label>
      <input type="range" id="length" name="length" min="8" max="16" value="12" step="1" required />
      <div class="checkboxes">
        <label for="uppercase">Include Uppercase Letters:</label>
        <input type="checkbox" id="uppercase" name="uppercase" checked />

        <label for="lowercase">Include Lowercase Letters:</label>
        <input type="checkbox" id="lowercase" name="lowercase" checked />

        <label for="numbers">Include Numbers:</label>
        <input type="checkbox" id="numbers" name="numbers" checked />

        <label for="symbols">Include Symbols:</label>
        <input type="checkbox" id="symbols" name="symbols" checked />
      </div>

      <button type="submit">Generate Password</button>
    </form>
  </section>
  <section class="wrapper output">
    <p class="password"></p>
    <p class="password"></p>
  </section>
  <div popover id="popover"></div>
</body>

</html>
